      - name: Focused C4 suites (functional + integrity; any failure, skip or expected failure fails the job)
        id: tests
        if: steps.verify.outcome == 'success'
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/c4-evidence
        shell: bash
        run: |
          set -u -o pipefail
          set +e  # an explicit `shell: bash` runs as `bash -eo pipefail`: record the real exit codes and evidence BEFORE failing
          mkdir -p "$EVIDENCE_DIR"
          : > "$EVIDENCE_DIR/tests.log"
          REQ=(--require-env COGNOUS_C4_CONTROL_PLANE_ROOT --require-env COGNOUS_C4_REPLAY_BUNDLE_ROOT --require-env COGNOUS_C4_EVIDENCE_PACK_ROOT --require-env COGNOUS_C4_ACTION_MANIFEST_ROOT)
          echo "=== suite: test_real_c4.py ===" | tee -a "$EVIDENCE_DIR/tests.log"
          python -I -B .github/scripts/run_unittest_no_skips.py tests/manual_contract/c4 --pattern test_real_c4.py "${REQ[@]}" 2>&1 | tee -a "$EVIDENCE_DIR/tests.log"
          RC_FUNCTIONAL="${PIPESTATUS[0]}"
          echo "=== suite: test_real_c4_integrity.py ===" | tee -a "$EVIDENCE_DIR/tests.log"
          python -I -B .github/scripts/run_unittest_no_skips.py tests/manual_contract/c4 --pattern test_real_c4_integrity.py "${REQ[@]}" 2>&1 | tee -a "$EVIDENCE_DIR/tests.log"
          RC_INTEGRITY="${PIPESTATUS[0]}"
          export RC_FUNCTIONAL RC_INTEGRITY
          TESTS_RC=0
          python3 -I -B - <<'PY' || TESTS_RC=1
          import json, os, re
          log = open(os.path.join(os.environ["EVIDENCE_DIR"], "tests.log"), encoding="utf-8").read()
          suites = []
          ok = True
          for pattern, rc_name, expected in (("test_real_c4.py", "RC_FUNCTIONAL", int(os.environ["C4_EXPECTED_FUNCTIONAL"])), ("test_real_c4_integrity.py", "RC_INTEGRITY", int(os.environ["C4_EXPECTED_INTEGRITY"]))):
              marker = "=== suite: %s ===" % pattern
              start = log.find(marker)
              nxt = [log.find("=== suite:", start + 1)] if start >= 0 else [-1]
              body = log[start + len(marker):nxt[0] if nxt[0] > 0 else len(log)] if start >= 0 else ""
              m = re.findall(r"^Ran (\d+) tests? in ", body, re.M)
              observed = int(m[0]) if len(m) == 1 else None
              rc = int(os.environ[rc_name])
              good = rc == 0 and observed == expected
              ok = ok and good
              suites.append({"pattern": pattern, "exit_code": rc, "expected_tests": expected, "observed_tests": observed,
                             "outcome": "PASSED" if good else "FAILED"})
          doc = {"command": "python -I -B .github/scripts/run_unittest_no_skips.py tests/manual_contract/c4 --pattern <file> --require-env <4 roots>",
                 "suites": suites, "total_expected": int(os.environ["C4_EXPECTED_FUNCTIONAL"]) + int(os.environ["C4_EXPECTED_INTEGRITY"]), "outcome": "PASSED" if ok else "FAILED"}
          with open(os.path.join(os.environ["EVIDENCE_DIR"], "tests.json"), "w", encoding="utf-8") as fh:
              json.dump(doc, fh, indent=2, sort_keys=True)
              fh.write("\n")
          raise SystemExit(0 if ok else 1)
          PY
          if [ "$RC_FUNCTIONAL" -ne 0 ] || [ "$RC_INTEGRITY" -ne 0 ] || [ "$TESTS_RC" -ne 0 ]; then exit 1; fi
          exit 0
      - name: Run P1, N1-HOLD and N2-FLIP through the harness (one invocation; all cases always run)
        id: cases
        if: always() && steps.verify.outcome == 'success'
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/c4-evidence
          WORK_ROOT: ${{ runner.temp }}/c4-work
        shell: bash
        run: |
          set -u -o pipefail
          set +e  # keep the evidence copies and the real exit code under the runner's -e
          mkdir -p "$EVIDENCE_DIR"
          python -I -B tests/manual_contract/real_c4.py --case all --workdir "$WORK_ROOT/c4" --out "$EVIDENCE_DIR/c4.result.json"
          CASES_RC=$?
          export CASES_RC
          # Keep the harness's own persisted files (the independently observed state), whatever the outcome.
          for s in p1 n1; do
            for n in cp-record destination reconstruction-bundle evidence-pack; do
              [ -f "$WORK_ROOT/c4/$s/$n.json" ] && cp "$WORK_ROOT/c4/$s/$n.json" "$EVIDENCE_DIR/c4.$s.$n.json"
            done
          done
          [ -f "$WORK_ROOT/c4/inputs/am-manifest.json" ] && cp "$WORK_ROOT/c4/inputs/am-manifest.json" "$EVIDENCE_DIR/c4.inputs.am-manifest.json"
          [ -f "$WORK_ROOT/c4/inputs/proposal.json" ] && cp "$WORK_ROOT/c4/inputs/proposal.json" "$EVIDENCE_DIR/c4.inputs.proposal.json"
          [ -f "$WORK_ROOT/c4/n2/mutated-bundle.json" ] && cp "$WORK_ROOT/c4/n2/mutated-bundle.json" "$EVIDENCE_DIR/c4.n2.mutated-bundle.json"
          python3 -I -B - <<'PY'
          import json, os
          with open(os.path.join(os.environ["EVIDENCE_DIR"], "cases.json"), "w", encoding="utf-8") as fh:
              json.dump({"exit_code": int(os.environ["CASES_RC"]), "invocations": 1,
                         "command": "python -I -B tests/manual_contract/real_c4.py --case all --workdir <fresh> --out <file>"}, fh, indent=2, sort_keys=True)
              fh.write("\n")
          PY
          if [ "$CASES_RC" -ne 0 ]; then exit 1; fi
          exit 0
      - name: Frozen-literal comparison (orchestrator-owned, not independent; a CLI exit code alone is not enough)
        id: oracle
        if: always() && steps.verify.outcome == 'success'
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/c4-evidence
          WORK_ROOT: ${{ runner.temp }}/c4-work
        shell: bash
        run: |
          set -euo pipefail
          python -I -B tests/manual_contract/c4/c4_hosted_check.py check
      - name: Job summary
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/c4-evidence
          STEP_GUARD: ${{ steps.guard.outcome }}
          STEP_CHECKOUT_CP: ${{ steps.checkout_cp.outcome }}
          STEP_CHECKOUT_RB: ${{ steps.checkout_rb.outcome }}
          STEP_CHECKOUT_PACK: ${{ steps.checkout_pack.outcome }}
          STEP_CHECKOUT_AM: ${{ steps.checkout_am.outcome }}
          STEP_INSTALL: ${{ steps.install.outcome }}
          STEP_VERIFY: ${{ steps.verify.outcome }}
          STEP_TESTS: ${{ steps.tests.outcome }}
          STEP_CASES: ${{ steps.cases.outcome }}
          STEP_ORACLE: ${{ steps.oracle.outcome }}
        shell: bash
        run: |
          python -I -B tests/manual_contract/c4/c4_hosted_check.py summary || true
      - name: Keep the C4 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: c4-evidence-${{ inputs.case_id }}
          path: ${{ runner.temp }}/c4-evidence/
          if-no-files-found: warn
