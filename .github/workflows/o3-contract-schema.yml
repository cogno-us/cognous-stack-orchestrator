name: O3 candidate reference schema tests
on:
  pull_request:
    paths:
      - 'development/schemas/**'
      - 'tests/contract/**'
      - '.github/workflows/o3-contract-schema.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r .github/locks/jsonschema-424038.txt
      - run: python -m unittest discover -s tests/contract -p 'test_*.py' -v
