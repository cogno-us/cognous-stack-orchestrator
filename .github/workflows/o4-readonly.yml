name: O4 read-only source boundary tests
on:
  pull_request:
    paths:
      - 'orchestration/**'
      - 'tests/integration/**'
      - '.github/workflows/o4-readonly.yml'
  workflow_dispatch:
jobs:
  boundary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/integration -p 'test_*.py' -v
