name: O4c-D scoped contract tests
on:
  pull_request:
    paths:
      - 'tests/contracts/exchange/**'
      - '.github/workflows/o4c-d-scoped.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/contracts/exchange -p 'test_*.py' -v
