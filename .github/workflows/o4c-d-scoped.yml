name: O4c-D scoped contract tests
on:
  pull_request:
    paths:
      - 'tests/contracts/exchange/**'
      - '.github/workflows/o4c-d-scoped.yml'
  workflow_dispatch:
jobs:
  scoped:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/contracts/exchange -p 'test_*.py' -v
