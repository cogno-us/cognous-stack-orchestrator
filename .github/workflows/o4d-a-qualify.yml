name: O4d-A exact scoped qualification
on:
  pull_request:
    paths:
      - 'tests/adapters/registry/authenticated_source/**'
      - '.github/workflows/o4d-a-qualify.yml'
  workflow_dispatch:
jobs:
  scoped:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/adapters/registry/authenticated_source -p 'test_*.py' -v
