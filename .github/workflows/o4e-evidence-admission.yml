name: O4e evidence admission contract
on:
  pull_request:
    paths:
      - 'development/acceptance/o4e/evidence_admission.py'
      - 'tests/contracts/o4e/**'
      - '.github/workflows/o4e-evidence-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/contracts/o4e -p 'test_*.py' -v
