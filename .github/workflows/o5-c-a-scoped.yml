name: O5-C-A scoped qualification
on:
  pull_request:
    paths:
      - 'development/scenarios/customer_refunds/control/**'
      - 'tests/scenarios/customer_refunds/control/**'
      - '.github/workflows/o5-c-a-scoped.yml'
  workflow_dispatch:
jobs:
  qualification:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/scenarios/customer_refunds/control -p 'test_*.py' -v
