name: O5-C postmerge refund qualification
on:
  pull_request:
    paths:
      - 'development/scenarios/customer_refunds/**'
      - 'tests/scenarios/customer_refunds/**'
      - '.github/workflows/o5-c-combined.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: O5 original and composed refund screening
        run: python -m unittest discover -s tests/scenarios/customer_refunds -p 'test_*.py' -v
      - name: O5-C-A Manifest and Control Plane
        run: python -m unittest discover -s tests/scenarios/customer_refunds/control -p 'test_*.py' -v
      - name: O5-C-B runtime refusal and idempotency
        run: python -m unittest discover -s tests/scenarios/customer_refunds/runtime -p 'test_*.py' -v
      - name: O5-C-C Replay/Evidence
        run: python -m unittest discover -s tests/scenarios/customer_refunds/replay -p 'test_*.py' -v
