name: O5-D-B pinned Execution Runtime refund qualification

on:
  pull_request:
    paths:
      - 'development/scenarios/customer_refunds/live_components/runtime/**'
      - 'tests/scenarios/customer_refunds/live_components/runtime/**'
      - '.github/workflows/o5-d-b-upstream-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-runtime-refund:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout orchestrator worker head
        uses: actions/checkout@v4

      - name: Checkout pinned Execution Runtime
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-execution-runtime
          ref: da9f52900ee2596dab087ec6c249ba84915d2b13
          path: .live/execution-runtime
          persist-credentials: false

      - name: Checkout selected Control Plane support revision
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-control-plane
          ref: e66e5f163c5d5c112ff345a2f332b4c3893ee183
          path: .live/control-plane
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test-only Python dependencies
        run: python -m pip install --disable-pip-version-check 'pydantic>=2,<3' 'pytest>=8,<9'

      - name: Verify exact upstream source revisions
        shell: bash
        run: |
          test "$(git -C .live/execution-runtime rev-parse HEAD)" = "da9f52900ee2596dab087ec6c249ba84915d2b13"
          test "$(git -C .live/control-plane rev-parse HEAD)" = "e66e5f163c5d5c112ff345a2f332b4c3893ee183"

      - name: Exercise actual pinned Runtime refund interfaces
        env:
          COGNOUS_EXECUTION_RUNTIME_ROOT: ${{ github.workspace }}/.live/execution-runtime
          COGNOUS_CONTROL_PLANE_ROOT: ${{ github.workspace }}/.live/control-plane
          PYTHONPATH: ${{ github.workspace }}/.live/execution-runtime:${{ github.workspace }}/.live/execution-runtime/tests:${{ github.workspace }}/.live/control-plane/src
        run: python -m pytest tests/scenarios/customer_refunds/live_components/runtime/test_actual_runtime.py -q
