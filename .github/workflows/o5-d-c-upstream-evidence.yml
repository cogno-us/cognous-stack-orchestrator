name: O5-D-C upstream evidence qualification
on:
  pull_request:
    paths:
      - 'development/scenarios/customer_refunds/live_components/evidence/**'
      - 'tests/scenarios/customer_refunds/live_components/evidence/**'
      - '.github/workflows/o5-d-c-upstream-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout orchestrator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Checkout exact Replay pin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: cogno-us/cognous-replay-bundle
          ref: 2a7963b18d96eb2e9e4fdb1a09c7588cf5c0ef00
          path: .upstream/replay

      - name: Checkout exact Evidence Pack pin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: cogno-us/cognous-governance-evidence-pack
          ref: 80e24650bb089d3a0cb9c0063c5b4bcc4a436123
          path: .upstream/evidence-pack

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install upstream runtime dependency
        run: python -m pip install --require-hashes -r .github/locks/pydantic-22835e.txt

      - name: Run scoped qualification
        env:
          COGNOUS_REPLAY_ROOT: ${{ github.workspace }}/.upstream/replay
          COGNOUS_EVIDENCE_PACK_ROOT: ${{ github.workspace }}/.upstream/evidence-pack
        run: python -m unittest discover -s tests/scenarios/customer_refunds/live_components/evidence -p 'test_*.py' -v
