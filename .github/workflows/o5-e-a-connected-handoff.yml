name: O5-E-A connected handoff pinned-source qualification
on:
  pull_request:
    paths:
      - '.github/workflows/o5-e-a-connected-handoff.yml'
      - 'development/scenarios/customer_refunds/connected/handoff/**'
      - 'tests/scenarios/customer_refunds/connected/handoff/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connected-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout orchestrator PR HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Checkout accepted Action Manifest
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: cogno-us/cognous-action-manifest
          ref: 8d1572d4f926c968a8704cb912a6e9d49166f74a
          path: .upstream/action-manifest
          persist-credentials: false
      - name: Checkout accepted Control Plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: cogno-us/cognous-control-plane
          ref: 3cd17ead6b24301290ad1e50ae4b22bbd93c12fb
          path: .upstream/control-plane
          persist-credentials: false
      - name: Checkout accepted Execution Runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: cogno-us/cognous-execution-runtime
          ref: 11de097c450d3ad4d89f9add41b00e38e7cc2c7c
          path: .upstream/execution-runtime
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Verify exact source revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .upstream/action-manifest rev-parse HEAD)" = "8d1572d4f926c968a8704cb912a6e9d49166f74a"
          test "$(git -C .upstream/control-plane rev-parse HEAD)" = "3cd17ead6b24301290ad1e50ae4b22bbd93c12fb"
          test "$(git -C .upstream/execution-runtime rev-parse HEAD)" = "11de097c450d3ad4d89f9add41b00e38e7cc2c7c"
          echo "Orchestrator checked out $(git rev-parse HEAD)"
      - name: Install pinned source package interfaces
        run: |
          python -m pip install 'pytest>=8,<9' 'pydantic>=2,<3'
          python -m pip install --no-deps -e .upstream/action-manifest -e .upstream/control-plane
      - name: Execute connected actual-source refund handoff
        env:
          COGNOUS_ACTION_MANIFEST_SRC: ${{ github.workspace }}/.upstream/action-manifest
          COGNOUS_CONTROL_PLANE_SRC: ${{ github.workspace }}/.upstream/control-plane
          COGNOUS_EXECUTION_RUNTIME_ROOT: ${{ github.workspace }}/.upstream/execution-runtime
        run: python -m pytest -q tests/scenarios/customer_refunds/connected/handoff/test_connected_handoff.py
