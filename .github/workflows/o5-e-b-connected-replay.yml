name: O5-E-B connected Replay Evidence qualification

on:
  pull_request:
    paths:
      - 'development/scenarios/customer_refunds/connected/replay/**'
      - 'tests/scenarios/customer_refunds/connected/replay/**'
      - '.github/workflows/o5-e-b-connected-replay.yml'
  workflow_dispatch:

jobs:
  connected-replay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout orchestrator
        uses: actions/checkout@v4

      - name: Checkout exact Replay pin
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-replay-bundle
          ref: 46e8bd7c263f5075cac3a7a9defcb265384f40e9
          path: .upstream/replay

      - name: Checkout exact Evidence Pack pin
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-governance-evidence-pack
          ref: 4fbbd34418f8dce7a536879d7bd0378737179f47
          path: .upstream/evidence-pack

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install upstream runtime dependency
        run: python -m pip install 'pydantic>=2.0'

      - name: Verify exact upstream source SHAs
        run: |
          test "$(git -C .upstream/replay rev-parse HEAD)" = "46e8bd7c263f5075cac3a7a9defcb265384f40e9"
          test "$(git -C .upstream/evidence-pack rev-parse HEAD)" = "4fbbd34418f8dce7a536879d7bd0378737179f47"

      - name: Run issue-57 scoped qualification
        env:
          COGNOUS_REPLAY_ROOT: ${{ github.workspace }}/.upstream/replay
          COGNOUS_EVIDENCE_PACK_ROOT: ${{ github.workspace }}/.upstream/evidence-pack
        run: python -m unittest discover -s tests/scenarios/customer_refunds/connected/replay -p 'test_*.py' -v
