name: O5-E-C connected refund contract matrix
on:
  pull_request:
    paths:
      - 'development/scenarios/customer_refunds/connected/contracts/**'
      - 'tests/scenarios/customer_refunds/connected/contracts/**'
      - '.github/workflows/o5-e-c-contract-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=8,<9'
      - name: Connected refund trace contract and adversarial matrix
        run: python -m pytest -q tests/scenarios/customer_refunds/connected/contracts/test_*.py
