name: O5-E combined connected refund qualification
on:
  pull_request:
    paths:
      - '.github/workflows/o5-e-combined.yml'
      - 'development/scenarios/customer_refunds/connected/**'
      - 'tests/scenarios/customer_refunds/connected/**'
  workflow_dispatch:
jobs:
  connected:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-action-manifest
          ref: 8d1572d4f926c968a8704cb912a6e9d49166f74a
          path: .upstream/action-manifest
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-control-plane
          ref: e66e5f163c5d5c112ff345a2f332b4c3893ee183
          path: .upstream/control-plane
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-execution-runtime
          ref: da9f52900ee2596dab087ec6c249ba84915d2b13
          path: .upstream/execution-runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-replay-bundle
          ref: 2069a0ba1398812c3a8669331a7d8b87c80c4a48
          path: .upstream/replay
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-governance-evidence-pack
          ref: 87293cfcbe8dfa2368d5bf77019945ba8ef1ae71
          path: .upstream/evidence-pack
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=8,<9' 'pydantic>=2,<3'
      - run: python -m pip install --no-deps -e .upstream/action-manifest -e .upstream/control-plane
      - name: Verify all source pins
        run: |
          test "$(git -C .upstream/action-manifest rev-parse HEAD)" = "8d1572d4f926c968a8704cb912a6e9d49166f74a"
          test "$(git -C .upstream/control-plane rev-parse HEAD)" = "e66e5f163c5d5c112ff345a2f332b4c3893ee183"
          test "$(git -C .upstream/execution-runtime rev-parse HEAD)" = "da9f52900ee2596dab087ec6c249ba84915d2b13"
          test "$(git -C .upstream/replay rev-parse HEAD)" = "2069a0ba1398812c3a8669331a7d8b87c80c4a48"
          test "$(git -C .upstream/evidence-pack rev-parse HEAD)" = "87293cfcbe8dfa2368d5bf77019945ba8ef1ae71"
      - name: Connected handoff against pinned source
        env:
          COGNOUS_ACTION_MANIFEST_SRC: ${{ github.workspace }}/.upstream/action-manifest
          COGNOUS_CONTROL_PLANE_SRC: ${{ github.workspace }}/.upstream/control-plane
          COGNOUS_EXECUTION_RUNTIME_ROOT: ${{ github.workspace }}/.upstream/execution-runtime
        run: python -m pytest -q tests/scenarios/customer_refunds/connected/handoff/test_connected_handoff.py
      - name: Connected Replay and Evidence
        env:
          COGNOUS_REPLAY_ROOT: ${{ github.workspace }}/.upstream/replay
          COGNOUS_EVIDENCE_PACK_ROOT: ${{ github.workspace }}/.upstream/evidence-pack
        run: python -m unittest discover -s tests/scenarios/customer_refunds/connected/replay -p 'test_*.py' -v
      - name: Connected contract and adversarial tests
        run: python -m pytest -q tests/scenarios/customer_refunds/connected/contracts/test_*.py
