name: O6-Q2 pinned source candidate regression
on:
  pull_request:
    paths:
      - ".github/workflows/o6-q2-pinned-source-candidate.yml"
      - "development/acceptance/o6-q2/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-connected-refund:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-action-manifest
          ref: 8d1572d4f926c968a8704cb912a6e9d49166f74a
          path: .upstream/action-manifest
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-control-plane
          ref: e66e5f163c5d5c112ff345a2f332b4c3893ee183
          path: .upstream/control-plane
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-execution-runtime
          ref: 1b0a9e32d010797711004ae612051a277b07912a
          path: .upstream/execution-runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-replay-bundle
          ref: 2069a0ba1398812c3a8669331a7d8b87c80c4a48
          path: .upstream/replay
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-governance-evidence-pack
          ref: 87293cfcbe8dfa2368d5bf77019945ba8ef1ae71
          path: .upstream/evidence-pack
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'pytest>=8,<9' 'pydantic>=2,<3'
      - run: python -m pip install --no-deps -e .upstream/action-manifest -e .upstream/control-plane
      - name: Verify exact frozen source pins
        run: |
          test "$(git -C .upstream/action-manifest rev-parse HEAD)" = "8d1572d4f926c968a8704cb912a6e9d49166f74a"
          test "$(git -C .upstream/control-plane rev-parse HEAD)" = "e66e5f163c5d5c112ff345a2f332b4c3893ee183"
          test "$(git -C .upstream/execution-runtime rev-parse HEAD)" = "1b0a9e32d010797711004ae612051a277b07912a"
          test "$(git -C .upstream/replay rev-parse HEAD)" = "2069a0ba1398812c3a8669331a7d8b87c80c4a48"
          test "$(git -C .upstream/evidence-pack rev-parse HEAD)" = "87293cfcbe8dfa2368d5bf77019945ba8ef1ae71"
      - name: Connected handoff on O6 runtime source
        env:
          COGNOUS_ACTION_MANIFEST_SRC: ${{ github.workspace }}/.upstream/action-manifest
          COGNOUS_CONTROL_PLANE_SRC: ${{ github.workspace }}/.upstream/control-plane
          COGNOUS_EXECUTION_RUNTIME_ROOT: ${{ github.workspace }}/.upstream/execution-runtime
        run: python -m pytest -q tests/scenarios/customer_refunds/connected/handoff/test_connected_handoff.py
      - name: Connected replay and independent evidence
        env:
          COGNOUS_REPLAY_ROOT: ${{ github.workspace }}/.upstream/replay
          COGNOUS_EVIDENCE_PACK_ROOT: ${{ github.workspace }}/.upstream/evidence-pack
        run: python -m unittest discover -s tests/scenarios/customer_refunds/connected/replay -p 'test_*.py' -v
      - name: Connected adversarial contract matrix
        run: python -m pytest -q tests/scenarios/customer_refunds/connected/contracts/test_*.py
      - name: O6 runtime-side revocation negative controls
        env:
          PYTHONPATH: ${{ github.workspace }}/.upstream/execution-runtime
        run: python -m pytest -q .upstream/execution-runtime/tests/test_o6_p1d_revocation_closeout.py

  gax-generation-fence-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-governed-exchange
          ref: 814927dac65a2078d5efee6bbf07c46091844822
          path: .upstream/gax
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: test "$(git -C .upstream/gax rev-parse HEAD)" = "814927dac65a2078d5efee6bbf07c46091844822"
      - run: python -m pip install -e './.upstream/gax[dev]'
      - name: Actual accepted GAX generation-fence negative tests
        working-directory: .upstream/gax
        run: python -m pytest -q tests/test_generation_fence.py

  attestation-digest-custody-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-evidence-attestation
          ref: 5786b91696ffa276650c4f7b424c9662ebf96fac
          path: .upstream/attestation
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: test "$(git -C .upstream/attestation rev-parse HEAD)" = "5786b91696ffa276650c4f7b424c9662ebf96fac"
      - run: python -m pip install -r .upstream/attestation/requirements.txt -r .upstream/attestation/requirements-dev.txt
      - name: Actual accepted attestation independent-custody negative tests
        working-directory: .upstream/attestation
        run: python -m pytest -q tests/test_authority_digest_custody_profile.py
