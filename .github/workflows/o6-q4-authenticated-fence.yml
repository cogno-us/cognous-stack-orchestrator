name: O6-Q4 authorized synthetic handoff and O6 fence
on:
  pull_request:
    paths:
      - ".github/workflows/o6-q4-authenticated-fence.yml"
      - "tests/integration/o6_q4/**"
      - "development/acceptance/o6-q4/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: cogno-us/cognous-action-manifest
          ref: ff5490828b2bf7f6a976da209f3f533701855687
          path: .upstream/action-manifest
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: cogno-us/cognous-control-plane
          ref: 2bac7875391cad0a431fa0d75208b7ade39743e3
          path: .upstream/control-plane
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: cogno-us/cognous-execution-runtime
          ref: 1b0a9e32d010797711004ae612051a277b07912a
          path: .upstream/runtime
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: cogno-us/cognous-governed-exchange
          ref: 814927dac65a2078d5efee6bbf07c46091844822
          path: .upstream/gax
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: cogno-us/cognous-evidence-attestation
          ref: 5786b91696ffa276650c4f7b424c9662ebf96fac
          path: .upstream/attestation
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install synthetic test and upstream verifier dependencies
        run: |
          python -m pip install -r .upstream/attestation/requirements.txt -r .upstream/attestation/requirements-dev.txt pytest==8.3.5
          python -m pip install --no-deps -e .upstream/action-manifest -e .upstream/control-plane
      - name: Qualify exact-source authorization and generation-fenced synthetic runtime
        env:
          COGNOUS_ACTION_MANIFEST_SRC: ${{ github.workspace }}/.upstream/action-manifest
          COGNOUS_CONTROL_PLANE_SRC: ${{ github.workspace }}/.upstream/control-plane
          COGNOUS_EXECUTION_RUNTIME_ROOT: ${{ github.workspace }}/.upstream/runtime
          COGNOUS_O6_Q2_RUNTIME_CANDIDATE: 1b0a9e32d010797711004ae612051a277b07912a
          COGNOUS_O6_RUNTIME_ROOT: ${{ github.workspace }}/.upstream/runtime
          COGNOUS_O6_GAX_ROOT: ${{ github.workspace }}/.upstream/gax
          COGNOUS_O6_ATTEST_ROOT: ${{ github.workspace }}/.upstream/attestation
        run: python -m pytest -q tests/integration/o6_q4/test_authorized_fenced_handoff.py
