name: O6-Q6 restart-safe reconciliation and adapter conformance
on:
  pull_request:
    paths:
      - ".github/workflows/o6-q6-reconciliation.yml"
      - "development/recovery/o6_q6/**"
      - "tests/integration/o6_q6/**"
      - "development/acceptance/o6-q6/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-execution-runtime
          ref: 1b0a9e32d010797711004ae612051a277b07912a
          path: .upstream/execution-runtime
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded test dependencies
        run: python -m pip install pytest==8.3.5
      - name: Check accepted source SHA and test provenance
        run: |
          test "$(git -C .upstream/execution-runtime rev-parse HEAD)" = "1b0a9e32d010797711004ae612051a277b07912a"
          PYTHONPATH="$PWD/.upstream/execution-runtime" python -m compileall -q development/recovery/o6_q6/reconciliation.py
      - name: Run actual Runtime closeout-backed fault and adapter controls
        env:
          COGNOUS_O6_Q6_RUNTIME_ROOT: ${{ github.workspace }}/.upstream/execution-runtime
        run: python -m pytest -q tests/integration/o6_q6/test_reconciliation.py
