name: Source-preserving handoff (developer tests)
on:
  pull_request:
    paths:
      - ".github/workflows/source-preserving-handoff.yml"
      - "development/acceptance/source-preserving-handoff/**"
      - "tests/integration/source_preserving_handoff/**"
      - "development/acceptance/lock-driven-handoff/handoff.py"
      - "development/acceptance/o6-q5/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  developer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install focused test runner
        run: python -m pip install --require-hashes -r .github/locks/pytest-b61d81.txt
      - name: Run developer tests (not independent acceptance)
        run: python -m pytest -q tests/integration/source_preserving_handoff
